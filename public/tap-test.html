<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>タップ計測テスト</title>
<style>
  * { touch-action: manipulation; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #f7f1de; color: #2b2b2b; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 8px; padding: max(24px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  h1 { font-size: 16px; margin: 0; }
  p { font-size: 13px; margin: 0; line-height: 1.5; }
  #pad { flex: 1; width: 100%; border-radius: 12px; background: #2b4a7a; display: block; }
  pre { margin: 0; padding: 8px; background: #fffdf6; border-radius: 8px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; }
  button { min-height: 44px; flex: 1; font-size: 14px; border-radius: 10px; border: 1px solid #c9bf9c; background: #fffdf6; }
</style>
</head>
<body>
<h1>タップ計測テスト(ゲームとは別の、ほぼ何もしないページ)</h1>
<p>青い部分を、ゆっくり 30 回ほどタップして、「タップあり」の遅れの割合を見ます。下のボタンで設定を 1 つずつ変えて(変えると数字はリセットされます)、遅れが減る設定を探します。</p>
<div id="holder" style="flex:1;display:flex;min-height:200px"></div>
<pre id="out">計測中…</pre>
<div class="row">
  <button id="method" type="button"></button>
  <button id="touchaction" type="button"></button>
</div>
<div class="row">
  <button id="prevent" type="button"></button>
  <button id="canvasmode" type="button"></button>
</div>
<div class="row">
  <button id="target" type="button"></button>
  <button id="reset" type="button">数字をリセット</button>
</div>
<script>
(function () {
  var holder = document.getElementById('holder');
  var out = document.getElementById('out');
  var SIZE = 180;
  var gaps = [], taps = [], delays = [];
  var last = 0, tapped = false, x = 0, flash = 0, maxHandler = 0;
  var canvas = null, ctx = null;

  // 試す設定。ボタンを押すと、順番に切り替わる
  var OPTIONS = {
    method: ['pointerdown', 'touchstart', 'mousedown'],
    touchaction: ['manipulation', 'none', 'auto'],
    prevent: ['なし', 'あり'],
    canvasmode: ['ふつう', '別描き'],
    target: ['canvas', '画面全体']
  };
  var LABELS = {
    method: function (v) { return '入力: ' + v; },
    touchaction: function (v) { return 'touch-action: ' + v; },
    prevent: function (v) { return 'touchstart を止める: ' + v; },
    canvasmode: function (v) { return 'Canvas: ' + v; },
    target: function (v) { return '受ける場所: ' + v; }
  };
  var state = { method: 0, touchaction: 0, prevent: 0, canvasmode: 0, target: 0 };
  var cur = function (k) { return OPTIONS[k][state[k]]; };

  function resize() {
    if (!canvas) return;
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  window.addEventListener('resize', resize);

  function onTap(e) {
    if (e.target && e.target.closest && e.target.closest('button')) return;
    var t0 = performance.now();
    tapped = true;
    flash = 6;
    // 入力が届くまでの時間(OS がイベントを作ってから、ここに届くまで)
    var d = t0 - e.timeStamp;
    if (d >= 0 && d < 1000) { delays.push(d); if (delays.length > 30) delays.shift(); }
    var h = performance.now() - t0;
    if (h > maxHandler) maxHandler = h;
    if (cur('prevent') === 'あり' && e.type === 'touchstart' && e.cancelable) e.preventDefault();
  }

  var attached = [];
  function detach() {
    attached.forEach(function (a) { a[0].removeEventListener(a[1], onTap, a[2]); });
    attached = [];
  }
  function attach() {
    detach();
    var where = cur('target') === 'canvas' ? canvas : document;
    var opts = { passive: cur('prevent') !== 'あり' };
    where.addEventListener(cur('method'), onTap, opts);
    attached.push([where, cur('method'), opts]);
  }

  // Canvas は、作るときに設定が決まるので、作り直す
  function build() {
    holder.textContent = '';
    canvas = document.createElement('canvas');
    canvas.id = 'pad';
    canvas.style.touchAction = cur('touchaction');
    holder.appendChild(canvas);
    resize();
    ctx = cur('canvasmode') === 'ふつう' ? canvas.getContext('2d') : canvas.getContext('2d', { alpha: false, desynchronized: true });
    attach();
  }

  function reset() { gaps = []; taps = []; delays = []; maxHandler = 0; last = 0; }

  Object.keys(OPTIONS).forEach(function (k) {
    var b = document.getElementById(k);
    var label = function () { b.textContent = LABELS[k](cur(k)); };
    label();
    b.addEventListener('click', function () {
      state[k] = (state[k] + 1) % OPTIONS[k].length;
      label();
      build();
      reset();
    });
  });
  document.getElementById('reset').addEventListener('click', reset);
  build();

  function frame(now) {
    requestAnimationFrame(frame);
    if (last) {
      gaps.push(now - last);
      taps.push(tapped);
      if (gaps.length > SIZE) { gaps.shift(); taps.shift(); }
    }
    last = now;
    tapped = false;
    var w = canvas.width, h = canvas.height;
    ctx.fillStyle = flash > 0 ? '#5a82c0' : '#2b4a7a';
    ctx.fillRect(0, 0, w, h);
    if (flash > 0) flash -= 1;
    x = (x + w / 120) % w;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, h / 2 - 30, 60, 60);
  }
  requestAnimationFrame(frame);

  function median(a) {
    var s = a.slice().sort(function (p, q) { return p - q; });
    return s[Math.floor(s.length / 2)];
  }
  function avg(a) { return a.length ? a.reduce(function (p, q) { return p + q; }, 0) / a.length : 0; }
  function pct(n, d) { return d ? Math.round((n * 100) / d) + '%' : '--'; }

  setInterval(function () {
    if (gaps.length < 30) { out.textContent = '計測中…(' + gaps.length + '/' + SIZE + ')'; return; }
    var med = median(gaps);
    var late = 0, tapN = 0, tapLate = 0, noTapN = 0, noTapLate = 0, worst = 0;
    for (var i = 0; i < gaps.length; i++) {
      var isLate = gaps[i] > med * 1.5;
      if (gaps[i] > worst) worst = gaps[i];
      if (isLate) late += 1;
      if (taps[i]) { tapN += 1; if (isLate) tapLate += 1; }
      else { noTapN += 1; if (isLate) noTapLate += 1; }
    }
    out.textContent =
      'FPS ' + Math.round(1000 / med) + ' | 最悪 ' + Math.round(worst) + 'ms | 遅れ ' + pct(late, gaps.length) + '\n' +
      'タップあり ' + tapN + '回中 ' + (tapN ? pct(tapLate, tapN) : '--') + ' で遅れ | なしで遅れ ' + pct(noTapLate, noTapN) + '\n' +
      '入力 届くまで 平均 ' + (delays.length ? avg(delays).toFixed(1) : '--') + 'ms | 受付の処理 最大 ' + maxHandler.toFixed(1) + 'ms\n' +
      '設定 ' + cur('method') + ' / ' + cur('touchaction') + ' / 止める' + cur('prevent') + ' / ' + cur('canvasmode') + ' / ' + cur('target');
  }, 250);
})();
</script>
</body>
</html>
