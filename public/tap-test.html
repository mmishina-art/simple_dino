<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>タップ計測テスト</title>
<style>
  * { touch-action: manipulation; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #f7f1de; color: #2b2b2b; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 8px; padding: max(24px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  h1 { font-size: 16px; margin: 0; }
  p { font-size: 13px; margin: 0; line-height: 1.5; }
  #pad { flex: 1; min-height: 200px; border-radius: 12px; background: #2b4a7a; display: block; width: 100%; }
  pre { margin: 0; padding: 8px; background: #fffdf6; border-radius: 8px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; }
  button { min-height: 44px; flex: 1; font-size: 14px; border-radius: 10px; border: 1px solid #c9bf9c; background: #fffdf6; }
</style>
</head>
<body>
<h1>タップ計測テスト(ゲームとは別の、ほぼ何もしないページ)</h1>
<p>青い部分を、ゆっくり何度もタップしてください。白い四角は一定の速さで動きます。遅れの数字を見ます。</p>
<canvas id="pad"></canvas>
<pre id="out">計測中…</pre>
<div class="row">
  <button id="method" type="button">入力: pointerdown</button>
  <button id="reset" type="button">数字をリセット</button>
</div>
<script>
(function () {
  var canvas = document.getElementById('pad');
  var out = document.getElementById('out');
  var ctx = canvas.getContext('2d');
  var SIZE = 180;
  var gaps = [], taps = [];
  var last = 0, tapped = false, x = 0, flash = 0;
  var delays = [];
  var method = 'pointerdown';
  var maxHandler = 0;

  function resize() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function onTap(e) {
    var t0 = performance.now();
    tapped = true;
    flash = 6;
    // 入力が届くまでの時間(OS がイベントを作ってから、ここに届くまで)
    var d = t0 - e.timeStamp;
    if (d >= 0 && d < 1000) { delays.push(d); if (delays.length > 30) delays.shift(); }
    var h = performance.now() - t0;
    if (h > maxHandler) maxHandler = h;
  }
  function attach() {
    canvas.removeEventListener('pointerdown', onTap);
    canvas.removeEventListener('touchstart', onTap);
    canvas.addEventListener(method, onTap, { passive: true });
  }
  attach();

  document.getElementById('method').addEventListener('click', function () {
    method = method === 'pointerdown' ? 'touchstart' : 'pointerdown';
    this.textContent = '入力: ' + method;
    attach();
  });
  document.getElementById('reset').addEventListener('click', function () {
    gaps = []; taps = []; delays = []; maxHandler = 0;
  });

  function frame(now) {
    requestAnimationFrame(frame);
    if (last) {
      gaps.push(now - last);
      taps.push(tapped);
      if (gaps.length > SIZE) { gaps.shift(); taps.shift(); }
    }
    last = now;
    tapped = false;
    var w = canvas.width, h = canvas.height;
    ctx.fillStyle = flash > 0 ? '#5a82c0' : '#2b4a7a';
    ctx.fillRect(0, 0, w, h);
    if (flash > 0) flash -= 1;
    x = (x + w / 120) % w;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, h / 2 - 30, 60, 60);
  }
  requestAnimationFrame(frame);

  function median(a) {
    var s = a.slice().sort(function (p, q) { return p - q; });
    return s[Math.floor(s.length / 2)];
  }
  function avg(a) { return a.length ? a.reduce(function (p, q) { return p + q; }, 0) / a.length : 0; }
  function pct(n, d) { return d ? Math.round((n * 100) / d) + '%' : '--'; }

  setInterval(function () {
    if (gaps.length < 30) { out.textContent = '計測中…(' + gaps.length + '/' + SIZE + ')'; return; }
    var med = median(gaps);
    var late = 0, tapN = 0, tapLate = 0, noTapN = 0, noTapLate = 0, worst = 0;
    for (var i = 0; i < gaps.length; i++) {
      var isLate = gaps[i] > med * 1.5;
      if (gaps[i] > worst) worst = gaps[i];
      if (isLate) late += 1;
      if (taps[i]) { tapN += 1; if (isLate) tapLate += 1; }
      else { noTapN += 1; if (isLate) noTapLate += 1; }
    }
    out.textContent =
      'FPS ' + Math.round(1000 / med) + ' | 最悪 ' + Math.round(worst) + 'ms | 遅れ ' + pct(late, gaps.length) + '\n' +
      'タップあり ' + tapN + '回中 ' + (tapN ? pct(tapLate, tapN) : '--') + ' で遅れ | なしで遅れ ' + pct(noTapLate, noTapN) + '\n' +
      '入力 届くまで 平均 ' + (delays.length ? avg(delays).toFixed(1) : '--') + 'ms | 受付の処理 最大 ' + maxHandler.toFixed(1) + 'ms\n' +
      '方式 ' + method;
  }, 250);
})();
</script>
</body>
</html>
